name: Deploy RDxClaw

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build
        run: make generate && make build

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdxclaw-binary
          path: build/rdxclaw-linux-amd64
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: rdxclaw-binary
          path: build/

      - name: SCP Binary
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "build/rdxclaw-linux-amd64"
          target: "/tmp/"
          strip_components: 1
          overwrite: true
          timeout: 60s
          command_timeout: 10m

      - name: SCP Deploy Script
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "scripts/deploy.sh"
          target: "/home/${{ secrets.VPS_USER }}/scripts/"
          strip_components: 1
          overwrite: true
          timeout: 60s

      - name: Deploy & Start
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e

            echo "=== [1/4] Preparing ==="
            chmod +x ~/scripts/deploy.sh
            chmod +x /tmp/rdxclaw-linux-amd64

            echo "=== [2/4] Running deploy script ==="
            ~/scripts/deploy.sh

            echo "=== [3/4] Verifying service ==="
            sleep 3
            if systemctl is-active --quiet rdxclaw; then
              echo "✅ rdxclaw service is running"
            else
              echo "❌ rdxclaw service failed to start"
              sudo journalctl -u rdxclaw --no-pager -n 30
              exit 1
            fi

            echo "=== [4/4] Deployment complete ==="
            systemctl status rdxclaw --no-pager

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Notify success
        if: needs.deploy.result == 'success'
        run: echo "✅ Deployment to rdxclaw succeeded"

      - name: Notify failure
        if: needs.deploy.result != 'success'
        run: |
          echo "❌ Deployment failed"
          exit 1