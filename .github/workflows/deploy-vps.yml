name: Deploy RDxClaw

on:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  APP_NAME: rdxclaw
  BINARY_NAME: rdxclaw-linux-amd64
  GO_VERSION: '1.24'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: make generate && make build

      - name: Verify binary exists
        run: |
          if [ ! -f "build/${{ env.BINARY_NAME }}" ]; then
            echo "❌ Binary not found at build/${{ env.BINARY_NAME }}"
            exit 1
          fi
          echo "✅ Binary size: $(du -sh build/${{ env.BINARY_NAME }} | cut -f1)"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-binary
          path: build/${{ env.BINARY_NAME }}
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout (for deploy script)
        uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-binary
          path: build/

      - name: Verify downloaded binary
        run: |
          chmod +x build/${{ env.BINARY_NAME }}
          echo "✅ Binary ready: $(du -sh build/${{ env.BINARY_NAME }} | cut -f1)"

      - name: SCP Binary to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "build/${{ env.BINARY_NAME }}"
          target: "/tmp/"
          strip_components: 1
          overwrite: true
          timeout: 60s
          command_timeout: 10m

      - name: SCP Deploy Script to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "scripts/deploy.sh"
          target: "/tmp/"
          strip_components: 1
          overwrite: true
          timeout: 60s

- name: Deploy & Verify
  uses: appleboy/ssh-action@v1
  with:
    host: ${{ secrets.VPS_HOST }}
    username: ${{ secrets.VPS_USER }}
    key: ${{ secrets.VPS_SSH_KEY }}
    port: 22
    envs: RDXCLAW_PROVIDER,RDXCLAW_API_KEY,RDXCLAW_MODEL
    script: |
      set -e
      # Write env file from CI secrets
      mkdir -p ~/.rdxclaw
      cat > ~/.rdxclaw/env << ENVEOF
      RDXCLAW_PROVIDER=$RDXCLAW_PROVIDER
      RDXCLAW_API_KEY=$RDXCLAW_API_KEY
      RDXCLAW_MODEL=$RDXCLAW_MODEL
      ENVEOF
      chmod 600 ~/.rdxclaw/env

      mkdir -p ~/scripts
      mv /tmp/deploy.sh ~/scripts/deploy.sh
      chmod +x ~/scripts/deploy.sh
      chmod +x /tmp/rdxclaw-linux-amd64
      ~/scripts/deploy.sh
  env:
    RDXCLAW_PROVIDER: ${{ secrets.RDXCLAW_PROVIDER }}
    RDXCLAW_API_KEY: ${{ secrets.RDXCLAW_API_KEY }}
    RDXCLAW_MODEL: ${{ secrets.RDXCLAW_MODEL }}

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [ build, deploy ]
    if: always()
    steps:
      - name: Success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Deployment succeeded"
          echo "  Commit:  ${{ github.sha }}"
          echo "  Branch:  ${{ github.ref_name }}"
          echo "  By:      ${{ github.actor }}"
          echo "  Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Failure
        if: needs.build.result == 'failure' || needs.deploy.result == 'failure'
        run: |
          echo "❌ Deployment failed"
          echo "  Build:   ${{ needs.build.result }}"
          echo "  Deploy:  ${{ needs.deploy.result }}"
          echo "  Commit:  ${{ github.sha }}"
          echo "  Logs:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1